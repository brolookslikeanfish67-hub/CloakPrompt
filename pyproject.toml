[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloakprompt"
version = "0.1.0"
description = "A local PII masking engine that sits between your app and any cloud LLM provider."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["privacy", "pii", "llm", "openai", "anthropic", "security", "redaction", "masking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]

[project.scripts]
cloakprompt = "cloakprompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
